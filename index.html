<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>भिशी प्रो - डिजिटल डायरी</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 font-sans pb-12">

    <!-- Header -->
    <header class="bg-gradient-to-r from-indigo-700 to-blue-800 text-white p-4 shadow-xl sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-vault text-amber-400"></i> भिशी प्रो (Bhishi Pro)
            </h1>
            <div class="text-right">
                <p class="text-xs text-indigo-200">एकूण जमा फंड</p>
                <span id="grandTotalPool" class="text-lg font-extrabold text-amber-300">₹0</span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6">

        <!-- Quick Settings & Stats -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
                <div>
                    <p class="text-xs text-slate-500 font-medium">मासिक हप्ता रक्कम</p>
                    <input type="number" id="installmentAmount" value="1000" onchange="updateSettings()" class="text-lg font-bold text-indigo-700 w-28 outline-none border-b border-indigo-300 focus:border-indigo-600">
                </div>
                <div class="bg-indigo-50 p-3 rounded-xl text-indigo-600">
                    <i class="fa-solid fa-wallet text-xl"></i>
                </div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
                <div>
                    <p class="text-xs text-slate-500 font-medium">एकूण सदस्य</p>
                    <h3 id="totalMemberCount" class="text-lg font-bold text-slate-800">0</h3>
                </div>
                <div class="bg-emerald-50 p-3 rounded-xl text-emerald-600">
                    <i class="fa-solid fa-users text-xl"></i>
                </div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex bg-white rounded-2xl shadow-sm p-1.5 border border-slate-200 gap-1">
            <button onclick="switchTab('tracker')" id="tab-tracker" class="flex-1 py-2.5 rounded-xl font-bold text-sm transition bg-indigo-600 text-white shadow"><i class="fa-solid fa-calendar-days mr-1"></i> महिना हिशोब</button>
            <button onclick="switchTab('members')" id="tab-members" class="flex-1 py-2.5 rounded-xl font-bold text-sm transition text-slate-600 hover:bg-slate-50"><i class="fa-solid fa-user-group mr-1"></i> सदस्य यादी</button>
        </div>

        <!-- SECTION 1: MONTHLY TRACKER -->
        <section id="section-tracker" class="space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-3">
                <div class="w-full sm:w-auto">
                    <label class="text-xs text-slate-500 block mb-1 font-medium">महिना निवडा</label>
                    <select id="monthSelect" onchange="renderTracker()" class="border p-2.5 rounded-xl font-bold text-slate-800 outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-48 bg-slate-50">
                        <option value="महिना १">महिना १</option>
                        <option value="महिना २">महिना २</option>
                        <option value="महिना ३">महिना ३</option>
                        <option value="महिना ४">महिना ४</option>
                        <option value="महिना ५">महिना ५</option>
                        <option value="महिना ६">महिना ६</option>
                        <option value="महिना ७">महिना ७</option>
                        <option value="महिना ८">महिना ८</option>
                        <option value="महिना ९">महिना ९</option>
                        <option value="महिना १०">महिना १०</option>
                        <option value="महिना ११">महिना ११</option>
                        <option value="महिना १२">महिना १२</option>
                    </select>
                </div>
                <div class="flex gap-2 w-full sm:w-auto">
                    <div class="bg-indigo-50 border border-indigo-100 p-3 rounded-xl flex-1 text-center">
                        <span class="text-xs text-indigo-600 block font-medium">चेक कलेक्शन</span>
                        <strong id="monthCollection" class="text-indigo-800 text-base">₹0</strong>
                    </div>
                </div>
            </div>

            <!-- Auction & Winner Box -->
            <div class="bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-200 p-4 rounded-2xl shadow-sm space-y-3">
                <h3 class="font-bold text-amber-900 text-sm flex items-center gap-2"><i class="fa-solid fa-trophy text-amber-600"></i> या महिन्याचा मानकरी व लिलाव</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-amber-800 block mb-1 font-medium">मानकरी सदस्य (Winner)</label>
                        <select id="monthWinnerSelect" onchange="saveMonthDetails()" class="border border-amber-300 p-2.5 rounded-xl font-semibold text-slate-800 outline-none w-full bg-white">
                            <option value="">-- मानकरी निवडा --</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-amber-800 block mb-1 font-medium">उचललेली / लिलाव रक्कम (₹)</label>
                        <input type="number" id="auctionAmount" placeholder="उदा. 8500" onchange="saveMonthDetails()" class="border border-amber-300 p-2.5 rounded-xl font-semibold text-slate-800 outline-none w-full bg-white">
                    </div>
                </div>
            </div>

            <!-- Members Payment Table -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 border-b bg-slate-50 flex justify-between items-center">
                    <h3 class="font-bold text-slate-800 text-sm">सदस्यांची हप्ता स्थिती</h3>
                    <span id="paidSummaryCount" class="text-xs font-bold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full">0 भरले / 0 बाकी</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b text-slate-500 text-xs bg-slate-50/50">
                                <th class="p-3">सदस्याचे नाव</th>
                                <th class="p-3 text-center">हप्ता भरला? (Paid)</th>
                            </tr>
                        </thead>
                        <tbody id="trackerTableBody" class="divide-y text-sm text-slate-700">
                            <!-- JS Fills -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- SECTION 2: MEMBERS MANAGEMENT -->
        <section id="section-members" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <h3 class="font-bold text-slate-800 text-sm mb-3">नवीन सदस्य जोडा</h3>
                <form id="memberForm" onsubmit="addMember(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input type="text" id="memberName" placeholder="सदस्याचे पूर्ण नाव" required class="border p-2.5 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    <input type="tel" id="memberPhone" placeholder="मोबाईल नंबर (पर्यायी)" class="border p-2.5 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl transition text-sm shadow">सदस्य समाविष्ट करा</button>
                </form>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 border-b bg-slate-50">
                    <h3 class="font-bold text-slate-800 text-sm">सर्व सदस्यांची यादी</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b text-slate-500 text-xs bg-slate-50/50">
                                <th class="p-3">अ.क्र.</th>
                                <th class="p-3">नाव व मोबाईल</th>
                                <th class="p-3 text-center">कृती</th>
                            </tr>
                        </thead>
                        <tbody id="memberTableBody" class="divide-y text-sm text-slate-700">
                            <!-- JS Fills -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- JavaScript Logic -->
    <script>
        let members = JSON.parse(localStorage.getItem('bhishi_members_v3')) || [];
        let records = JSON.parse(localStorage.getItem('bhishi_records_v3')) || {};
        let monthDetails = JSON.parse(localStorage.getItem('bhishi_month_details_v3')) || {};
        let installment = parseFloat(localStorage.getItem('bhishi_installment_v3')) || 1000;

        document.getElementById('installmentAmount').value = installment;

        function updateSettings() {
            installment = parseFloat(document.getElementById('installmentAmount').value) || 0;
            localStorage.setItem('bhishi_installment_v3', installment);
            calculateGrandTotal();
            renderTracker();
        }

        function saveData() {
            localStorage.setItem('bhishi_members_v3', JSON.stringify(members));
            localStorage.setItem('bhishi_records_v3', JSON.stringify(records));
            localStorage.setItem('bhishi_month_details_v3', JSON.stringify(monthDetails));
            calculateGrandTotal();
        }

        function switchTab(tab) {
            document.getElementById('section-tracker').classList.add('hidden');
            document.getElementById('section-members').classList.add('hidden');
            document.getElementById('tab-tracker').className = 'flex-1 py-2.5 rounded-xl font-bold text-sm transition text-slate-600 hover:bg-slate-50';
            document.getElementById('tab-members').className = 'flex-1 py-2.5 rounded-xl font-bold text-sm transition text-slate-600 hover:bg-slate-50';

            if(tab === 'tracker') {
                document.getElementById('section-tracker').classList.remove('hidden');
                document.getElementById('tab-tracker').className = 'flex-1 py-2.5 rounded-xl font-bold text-sm transition bg-indigo-600 text-white shadow';
                renderTracker();
            } else {
                document.getElementById('section-members').classList.remove('hidden');
                document.getElementById('tab-members').className = 'flex-1 py-2.5 rounded-xl font-bold text-sm transition bg-indigo-600 text-white shadow';
                renderMembers();
            }
        }

        function addMember(e) {
            e.preventDefault();
            const name = document.getElementById('memberName').value.trim();
            const phone = document.getElementById('memberPhone').value.trim();
            
            members.push({ id: Date.now(), name, phone });
            document.getElementById('memberForm').reset();
            saveData();
            renderMembers();
        }

        function deleteMember(id) {
            if(confirm('हा सदस्य डिलीट करायचा का?')) {
                members = members.filter(m => m.id !== id);
                saveData();
                renderMembers();
            }
        }

        function renderMembers() {
            const tbody = document.getElementById('memberTableBody');
            document.getElementById('totalMemberCount').innerText = members.length;
            tbody.innerHTML = '';
            
            if(members.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-slate-400">कोणतीही नोंद नाही. आधी वर फॉर्ममधून सदस्य जोडा.</td></tr>`;
                return;
            }
            members.forEach((m, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 text-slate-500 font-medium">${index + 1}</td>
                        <td class="p-3">
                            <p class="font-bold text-slate-800">${m.name}</p>
                            <p class="text-xs text-slate-500">${m.phone || 'मोबाईल नंबर नाही'}</p>
                        </td>
                        <td class="p-3 text-center">
                            <button onclick="deleteMember(${m.id})" class="text-red-500 bg-red-50 p-2 rounded-xl transition hover:bg-red-100"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function renderTracker() {
            const month = document.getElementById('monthSelect').value;
            const tbody = document.getElementById('trackerTableBody');
            tbody.innerHTML = '';

            // Populate Winner Dropdown
            const winnerSelect = document.getElementById('monthWinnerSelect');
            winnerSelect.innerHTML = `<option value="">-- मानकरी निवडा --</option>`;
            members.forEach(m => {
                winnerSelect.innerHTML += `<option value="${m.id}">${m.name}</option>`;
            });

            if(!records[month]) records[month] = {};
            if(!monthDetails[month]) monthDetails[month] = { winnerId: '', auctionAmt: '' };

            winnerSelect.value = monthDetails[month].winnerId || '';
            document.getElementById('auctionAmount').value = monthDetails[month].auctionAmt || '';

            if(members.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" class="p-6 text-center text-slate-400">आधी 'सदस्य यादी' मध्ये जाऊन मेंबर्स जोडा.</td></tr>`;
                document.getElementById('monthCollection').innerText = '₹0';
                document.getElementById('paidSummaryCount').innerText = '0 भरले / 0 बाकी';
                return;
            }

            let paidCount = 0;
            members.forEach(m => {
                if(records[month][m.id] === undefined) {
                    records[month][m.id] = false;
                }
                const isPaid = records[month][m.id];
                if(isPaid) paidCount++;

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 font-semibold text-slate-800">${m.name}</td>
                        <td class="p-3 text-center">
                            <input type="checkbox" ${isPaid ? 'checked' : ''} onchange="togglePaid('${month}', ${m.id})" class="w-6 h-6 accent-indigo-600 cursor-pointer rounded-lg">
                        </td>
                    </tr>
                `;
            });

            let collection = paidCount * installment;
            document.getElementById('monthCollection').innerText = `₹${collection.toLocaleString('en-IN')}`;
            document.getElementById('paidSummaryCount').innerText = `${paidCount} भरले / ${members.length - paidCount} बाकी`;
            calculateGrandTotal();
        }

        function togglePaid(month, memberId) {
            records[month][memberId] = !records[month][memberId];
            saveData();
            renderTracker();
        }

        function saveMonthDetails() {
            const month = document.getElementById('monthSelect').value;
            const winnerId = document.getElementById('monthWinnerSelect').value;
            const auctionAmt = document.getElementById('auctionAmount').value;

            if(!monthDetails[month]) monthDetails[month] = {};
            monthDetails[month].winnerId = winnerId;
            monthDetails[month].auctionAmt = auctionAmt;
            saveData();
        }

        function calculateGrandTotal() {
            let totalPaidCount = 0;
            for(let m in records) {
                for(let id in records[m]) {
                    if(records[m][id]) totalPaidCount++;
                }
            }
            let grandTotal = totalPaidCount * installment;
            document.getElementById('grandTotalPool').innerText = `₹${grandTotal.toLocaleString('en-IN')}`;
        }

        // Initial Load
        renderMembers();
        calculateGrandTotal();
    </script>
</body>
</html>
